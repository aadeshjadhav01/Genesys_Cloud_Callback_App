<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<title>Outbound Call Trigger</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #14202b; --muted: #5b6b79;
    --border: #d9e0e6; --accent: #0f766e; --accent-text: #ffffff;
    --danger: #b42318; --ok: #067647; --warn: #b54708; --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1418; --card: #172026; --text: #e6edf2; --muted: #93a4b1;
      --border: #2a3740; --accent: #2dd4bf; --accent-text: #062a26;
      --danger: #f97066; --ok: #47cd89; --warn: #fdb022; --input: #0e1418;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  h1 { font-size: 20px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%; font-size: 17px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--input); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; font-size: 17px; font-weight: 600; padding: 14px; border-radius: 12px;
    border: 0; background: var(--accent); color: var(--accent-text); margin-top: 14px; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.link { width: auto; background: none; color: var(--muted); padding: 6px 8px; margin: 0; font-size: 14px; font-weight: 500; }
  button:disabled { opacity: .55; }
  .big { font-size: 20px; padding: 18px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .status { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 15px; }
  .pill { font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor; font-size: 13px; text-transform: uppercase; }
  .on { color: var(--ok); } .off { color: var(--muted); } .other { color: var(--warn); }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  #log { font-size: 13px; color: var(--muted); max-height: 180px; overflow-y: auto; }
  #log div { padding: 6px 0; border-top: 1px solid var(--border); }
  #log div:first-child { border-top: 0; }
  #log .err { color: var(--danger); } #log .good { color: var(--ok); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Outbound Call Trigger</h1>
  </header>

  <!-- Sign in -->
  <section id="viewSignin" class="card hidden">
    <p style="margin:0">Sign in with your Genesys Cloud account to load your campaigns.</p>
    <p id="signinMsg" class="hint" style="color:var(--danger)"></p>
    <button id="btnLogin">Sign in with Genesys</button>
  </section>

  <!-- Main -->
  <section id="viewMain" class="hidden">
    <div class="card">
      <label for="campaign">Campaign</label>
      <select id="campaign"><option>Loading…</option></select>
      <div class="status">
        <span>Contact list</span>
        <span id="listName" style="font-weight:600">—</span>
      </div>
      <div class="status">
        <span>Status</span>
        <span id="statusPill" class="pill off">—</span>
      </div>
      <div class="row">
        <button class="secondary" id="btnOn">Turn on</button>
        <button class="secondary" id="btnOff">Turn off</button>
      </div>
    </div>

    <div class="card">
      <label for="phone">Phone number</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="98765 43210">
      <label for="name">Name (optional)</label>
      <input id="name" autocomplete="off" placeholder="Customer name">
      <button class="big" id="btnCall">Call now</button>
      <p class="hint">Adds the number to the front of the campaign's contact list and turns the campaign on if needed.</p>
    </div>

    <div class="card">
      <label>Activity</label>
      <div id="log"></div>
      <button class="link" id="btnLogout">Sign out</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

const CONFIG = { region: "aps1.pure.cloud", clientId: "c7673f05-ee51-4e5d-b879-8f3b0301ed1c", cc: "+91" };
let cfg = Object.assign({ campaignId: "" }, store.get("gct_cfg") || {}, CONFIG);
let auth = store.get("gct_auth"); // { token, expires }
let campaigns = [];

const redirectUri = location.origin + location.pathname;

// ---------- OAuth (Authorization Code + PKCE) ----------
function b64url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randomString(len) {
  const a = new Uint8Array(len); crypto.getRandomValues(a); return b64url(a).slice(0, len);
}
async function sha256(str) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); }

// PKCE values must survive the redirect; keep them in both storages in case one is blocked.
function tmpSet(k, v) { try { sessionStorage.setItem(k, v); } catch {} try { localStorage.setItem(k, v); } catch {} }
function tmpGet(k) {
  let v = null;
  try { v = sessionStorage.getItem(k); } catch {}
  if (!v) { try { v = localStorage.getItem(k); } catch {} }
  return v;
}
function tmpDel(k) { try { sessionStorage.removeItem(k); } catch {} try { localStorage.removeItem(k); } catch {} }

async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  if (q.get("error")) {
    history.replaceState(null, "", redirectUri);
    signinError = true;
    log("Sign-in failed: " + (q.get("error_description") || q.get("error")), "err");
    return;
  }
  const code = q.get("code");
  if (!code) return;
  history.replaceState(null, "", redirectUri);
  const expected = tmpGet("gct_state"), verifier = tmpGet("gct_verifier");
  tmpDel("gct_state"); tmpDel("gct_verifier");
  if (!verifier || q.get("state") !== expected) { signinError = true; log("Sign-in state mismatch, please try again.", "err"); return; }
  try {
    const r = await fetch(`https://login.${cfg.region}/oauth/token`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        code, client_id: cfg.clientId, redirect_uri: redirectUri, code_verifier: verifier
      })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.access_token) throw new Error(d.error_description || d.error || `HTTP ${r.status}`);
    auth = { token: d.access_token, expires: Date.now() + (Number(d.expires_in) || 3600) * 1000 };
    store.set("gct_auth", auth);
  } catch (e) {
    signinError = true;
    log("Sign-in failed: " + e.message, "err");
  }
}

async function login() {
  const state = randomString(24);
  const verifier = randomString(64);
  const challenge = b64url(await sha256(verifier));
  tmpSet("gct_state", state);
  tmpSet("gct_verifier", verifier);
  const u = new URL(`https://login.${cfg.region}/oauth/authorize`);
  u.searchParams.set("response_type", "code");
  u.searchParams.set("client_id", cfg.clientId);
  u.searchParams.set("redirect_uri", redirectUri);
  u.searchParams.set("code_challenge", challenge);
  u.searchParams.set("code_challenge_method", "S256");
  u.searchParams.set("state", state);
  location.href = u.toString();
}
function loggedIn() { return auth && auth.token && auth.expires > Date.now() + 30000; }
function logout() { auth = null; store.del("gct_auth"); signinError = true; show(); }

// ---------- API ----------
async function api(method, path, body) {
  const r = await fetch(`https://api.${cfg.region}${path}`, {
    method,
    headers: { "Authorization": "Bearer " + auth.token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  });
  const txt = await r.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch { data = txt; }
  if (r.status === 401) { logout(); throw new Error("Session expired, please sign in again."); }
  if (!r.ok) {
    const msg = (data && (data.message || data.code)) || `HTTP ${r.status}`;
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return data;
}

async function loadCampaigns() {
  campaigns = [];
  let page = 1, pageCount = 1;
  do {
    const d = await api("GET", `/api/v2/outbound/campaigns?pageSize=100&pageNumber=${page}&sortBy=name&sortOrder=ascending`);
    campaigns.push(...(d.entities || []));
    pageCount = d.pageCount || 1; page++;
  } while (page <= pageCount && page <= 20);
  // Agentless campaigns first
  campaigns.sort((a, b) => (b.dialingMode === "agentless") - (a.dialingMode === "agentless") || a.name.localeCompare(b.name));
  const sel = $("campaign");
  sel.innerHTML = "";
  if (!campaigns.length) { sel.innerHTML = "<option value=''>No campaigns found</option>"; return; }
  for (const c of campaigns) {
    const o = document.createElement("option");
    o.value = c.id;
    o.textContent = c.name + (c.dialingMode === "agentless" ? "" : ` (${c.dialingMode})`);
    sel.appendChild(o);
  }
  if (cfg.campaignId && campaigns.some(c => c.id === cfg.campaignId)) sel.value = cfg.campaignId;
  cfg.campaignId = sel.value; store.set("gct_cfg", cfg);
  await refreshStatus();
}

async function getCampaign() { return api("GET", `/api/v2/outbound/campaigns/${cfg.campaignId}`); }

async function refreshStatus() {
  if (!cfg.campaignId) return;
  try {
    const c = await getCampaign();
    renderStatus(c.campaignStatus);
    $("listName").textContent = (c.contactList && c.contactList.name) || "None";
  }
  catch (e) { log("Couldn't read campaign status: " + e.message, "err"); }
}
function renderStatus(s) {
  const p = $("statusPill");
  p.textContent = s || "—";
  p.className = "pill " + (s === "on" ? "on" : s === "off" ? "off" : "other");
}

async function setCampaignStatus(on) {
  const want = on ? "on" : "off";
  for (let attempt = 0; attempt < 2; attempt++) {
    const c = await getCampaign();
    if (c.campaignStatus === want) { renderStatus(want); return c; }
    c.campaignStatus = want;
    try {
      const updated = await api("PUT", `/api/v2/outbound/campaigns/${c.id}`, c);
      renderStatus(updated.campaignStatus);
      return updated;
    } catch (e) {
      if (e.status === 409 && attempt === 0) continue; // version changed, retry once
      throw e;
    }
  }
}

function normalizeNumber(raw) {
  let n = raw.replace(/[^\d+]/g, "");
  if (!n) return "";
  if (n.startsWith("00")) n = "+" + n.slice(2);
  if (!n.startsWith("+")) {
    const cc = (cfg.cc || "").replace(/[^\d]/g, "");
    n = (cc ? "+" + cc : "") + n.replace(/^0+/, "");
  }
  return n;
}

async function callNow() {
  const number = normalizeNumber($("phone").value);
  if (number.replace(/\D/g, "").length < 8) { log("Enter a valid phone number.", "err"); return; }
  if (!cfg.campaignId) { log("Pick a campaign first.", "err"); return; }

  const c = await getCampaign();
  const listId = c.contactList && c.contactList.id;
  if (!listId) throw new Error("This campaign has no contact list.");
  const cl = await api("GET", `/api/v2/outbound/contactlists/${listId}`);
  const phoneCol = cl.phoneColumns && cl.phoneColumns[0] && cl.phoneColumns[0].columnName;
  if (!phoneCol) throw new Error("Contact list has no phone column.");

  const data = {};
  for (const col of cl.columnNames || []) data[col] = "";
  data[phoneCol] = number;
  const name = $("name").value.trim();
  if (name) {
    const nameCol = (cl.columnNames || []).find(col => /name/i.test(col) && col !== phoneCol);
    if (nameCol) data[nameCol] = name;
  }

  await api("POST", `/api/v2/outbound/contactlists/${listId}/contacts?priority=true`,
    [{ contactListId: listId, data, callable: true }]);
  log(`Queued ${number} at the front of "${cl.name}".`, "good");

  if (c.campaignStatus !== "on") {
    await setCampaignStatus(true);
    log(`Campaign "${c.name}" turned on.`, "good");
  } else {
    renderStatus("on");
  }
  $("phone").value = ""; $("name").value = "";
}

// ---------- UI ----------
function log(msg, cls) {
  const d = document.createElement("div");
  d.className = cls || "";
  d.textContent = new Date().toLocaleTimeString() + "  " + msg;
  $("log").prepend(d);
  if (cls === "err") $("signinMsg").textContent = msg;
}
async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { log(e.message, "err"); }
  finally { btn.disabled = false; }
}

let signinError = false;
function show() {
  const inApp = loggedIn();
  $("viewSignin").classList.toggle("hidden", inApp);
  $("viewMain").classList.toggle("hidden", !inApp);
  if (inApp) loadCampaigns().catch(e => log(e.message, "err"));
  else if (!signinError) login();
}
$("btnLogin").onclick = () => login();
$("btnLogout").onclick = logout;
$("campaign").onchange = e => { cfg.campaignId = e.target.value; store.set("gct_cfg", cfg); refreshStatus(); };
$("btnOn").onclick = e => busy(e.target, async () => { await setCampaignStatus(true); log("Campaign turned on.", "good"); });
$("btnOff").onclick = e => busy(e.target, async () => { await setCampaignStatus(false); log("Campaign turned off.", "good"); });
$("btnCall").onclick = e => busy(e.target, callNow);
$("phone").addEventListener("keydown", e => { if (e.key === "Enter") $("btnCall").click(); });

handleRedirect().finally(show);
</script>
</body>
</html>
